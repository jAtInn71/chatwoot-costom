services:
  postgres:
    image: pgvector/pgvector:pg14
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rails:
    image: ghcr.io/jatinn71/chatwoot-custom:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - '${PORT:-3001}:3000'
    volumes:
      - storage_data:/app/storage
      - ./logs:/app/log
    environment:
      DB_POOL: ${RAILS_MAX_THREADS:-5}
      DISABLE_DATABASE_ENVIRONMENT_CHECK: '1'
      RAILS_LOG_TO_STDOUT: 'true'
    networks:
      - chatwoot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /app/log /app/tmp/pids

        # ── Auto-generate SECRET_KEY_BASE (persist across restarts) ──────────
        SECRET_FILE=/app/storage/.secret_key_base
        if [ -z "$$SECRET_KEY_BASE" ]; then
          if [ -f "$$SECRET_FILE" ]; then
            export SECRET_KEY_BASE=$$(cat "$$SECRET_FILE")
            echo "Loaded SECRET_KEY_BASE from persistent storage."
          else
            export SECRET_KEY_BASE=$$(openssl rand -hex 64)
            echo "$$SECRET_KEY_BASE" > "$$SECRET_FILE"
            echo "Generated new SECRET_KEY_BASE and saved to persistent storage."
          fi
        else
          echo "Using SECRET_KEY_BASE from environment."
        fi

        rm -f /app/tmp/pids/server.pid
        echo 'Waiting for database...'
        until bundle exec rails db:version >/dev/null 2>&1; do
          echo 'Database not ready yet, waiting...'
          sleep 5
        done
        echo 'Database ready! Running setup...'
        bundle exec rails db:chatwoot_prepare

        echo 'Running custom migrations...'
        bundle exec rails runner "
          if ActiveRecord::Base.connection.table_exists?(:channel_web_widgets) &&
             !ActiveRecord::Base.connection.column_exists?(:channel_web_widgets, :elevenlabs_agent_id)
            Dir['/app/db/migrate/2026*.rb'].each do |f|
              version = File.basename(f).split('_').first
              ActiveRecord::Base.connection.execute(\"DELETE FROM schema_migrations WHERE version = '#{version}'\")
            end
            puts 'Custom migration versions cleared — fresh DB detected.'
          else
            puts 'Existing DB detected — skipping custom migration reset.'
          end
        " || true
        bundle exec rails db:migrate
        echo 'Custom migrations complete.'

        echo 'Setting up installation onboarding if fresh DB...'
        bundle exec rails runner "
          unless SuperAdmin.exists?
            key = Redis::Alfred::CHATWOOT_INSTALLATION_ONBOARDING
            Redis::Alfred.set(key, true)
            puts 'Fresh DB — installation onboarding Redis key set. Visit /app to begin setup.'
          else
            puts 'SuperAdmin exists — skipping onboarding key.'
          end

          Account.find_each do |a|
            next unless ['account_details', 'enrichment'].include?(a.custom_attributes&.dig('onboarding_step'))
            attrs = (a.custom_attributes || {}).except('onboarding_step')
            a.update_columns(custom_attributes: attrs)
          end
          puts 'Account onboarding step cleared.'

        " || echo 'Onboarding key setup skipped'

        echo 'Starting server...'
        exec bundle exec rails s -p 3000 -b '0.0.0.0'

  sidekiq:
    image: ghcr.io/jatinn71/chatwoot-custom:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      RAILS_LOG_TO_STDOUT: 'true'
    volumes:
      - storage_data:/app/storage
    networks:
      - chatwoot-network
    command:
      - sh
      - -c
      - |
        SECRET_FILE=/app/storage/.secret_key_base
        if [ -z "$$SECRET_KEY_BASE" ]; then
          echo "Waiting for SECRET_KEY_BASE to be generated by rails..."
          until [ -f "$$SECRET_FILE" ]; do
            sleep 2
          done
          export SECRET_KEY_BASE=$$(cat "$$SECRET_FILE")
          echo "Loaded SECRET_KEY_BASE from persistent storage."
        fi
        exec bundle exec sidekiq -C config/sidekiq.yml

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  chatwoot-network:
    driver: bridge
