<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Voice Call</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --widget-color: #3b8fe8;
      --widget-color-soft: rgba(66, 153, 225, 0.22);
      --widget-color-strong: rgba(66, 153, 225, 0.40);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border-tertiary: rgba(15, 23, 42, 0.10);
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI',
                   Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f1f5f9;
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    /* Card fills entire window */
    .popup {
      width: 100vw;
      height: 100vh;
      background: #fff;
      border-radius: 0;
      border: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px 5px;
      border-bottom: 0.5px solid var(--border-tertiary);
      flex-shrink: 0;
    }
    .popup-header .title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .live-badge {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 600;
      color: #e8533a;
    }
    .live-badge.show { display: inline-flex; }
    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e8533a;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── Body — fills remaining space ── */
    .popup-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px 6px;
      min-height: 0;
    }

    /* Avatar scales with available space using vmin */
    .avatar-wrap {
      position: relative;
      width: min(32vmin, 90px);
      height: min(32vmin, 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: min(2vmin, 8px);
      flex-shrink: 0;
    }
    .avatar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--widget-color-soft);
    }
    .ring1 { width: 100%; height: 100%; }
    .ring2 {
      width: 80%;
      height: 80%;
      border-color: var(--widget-color-strong);
    }

    .avatar {
      width: 62%;
      height: 62%;
      border-radius: 50%;
      border: 2px solid var(--widget-color);
      object-fit: cover;
      background: var(--widget-color-soft);
      position: relative;
      z-index: 1;
      overflow: hidden;
      transition: transform 240ms ease, box-shadow 240ms ease;
    }
    .speaking .avatar {
      transform: scale(1.04);
      box-shadow: 0 0 0 5px var(--widget-color-soft);
    }
    .speaking .ring2 { animation: pulse-ring 1.6s ease-in-out infinite; }
    .speaking .ring1 { animation: pulse-ring 1.6s ease-in-out infinite 0.4s; }
    @keyframes pulse-ring {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.04); }
    }

    .name {
      font-size: clamp(11px, 3.5vmin, 14px);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1px;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .role {
      font-size: clamp(9px, 2.5vmin, 11px);
      color: var(--text-secondary);
      margin-bottom: min(2vmin, 8px);
    }

    .connected-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      border-radius: 16px;
      padding: 3px 10px;
      font-size: clamp(8px, 2.5vmin, 10px);
      font-weight: 500;
    }
    .connected-badge[data-state="connecting"] {
      background: #fffbeb;
      border: 0.5px solid #fde68a;
      color: #b45309;
    }
    .connected-badge[data-state="connected"] {
      background: #edfaf3;
      border: 0.5px solid #a3e9c0;
      color: #1b7a47;
    }
    .connected-badge[data-state="ended"],
    .connected-badge[data-state="error"] {
      background: #f1f5f9;
      border: 0.5px solid #cbd5e1;
      color: #64748b;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .popup-footer {
      padding: 0 10px 6px;
      flex-shrink: 0;
    }
    .end-btn {
      width: 100%;
      background: #e8533a;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: clamp(10px, 3vmin, 12px);
      font-weight: 600;
      padding: clamp(6px, 2vmin, 9px) 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .end-btn:hover:not(:disabled) { background: #c93f28; }
    .end-btn:active:not(:disabled) { transform: scale(0.98); }
    .end-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
    .end-btn svg { width: 11px; height: 11px; flex-shrink: 0; }

    /* ── Brand line — always visible ── */
    .brand {
      padding: 0 10px 6px;
      text-align: center;
      font-size: clamp(8px, 2vmin, 9px);
      color: var(--text-secondary);
      font-weight: 500;
      flex-shrink: 0;
    }
    .brand strong {
      color: var(--text-primary);
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="popup">
    <div class="popup-header">
      <span class="title">Voice Call</span>
      <span class="live-badge" id="liveBadge">
        <span class="live-dot"></span>
        LIVE
      </span>
    </div>

    <div class="popup-body" id="popupBody">
      <div class="avatar-wrap">
        <div class="avatar-ring ring1"></div>
        <div class="avatar-ring ring2"></div>
        <img class="avatar" id="avatarImg" alt="Agent" />
      </div>
      <div class="name" id="agentName">AI Assistant</div>
      <div class="role" id="agentRole">Voice Assistant</div>
      <div class="connected-badge" id="status" data-state="connecting">
        <span class="badge-dot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>

    <div class="popup-footer">
      <button class="end-btn" id="endCallBtn" disabled aria-label="End call">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3.5 14.5c5.5-5 11.5-5 17 0 .8.7.9 2 0 2.7l-2.1 1.6c-.5.4-1.2.4-1.7 0l-2-1.7
                   a1.5 1.5 0 0 1-.5-1.1V14a9.8 9.8 0 0 0-4.4 0v0c0 .4-.2.8-.5 1.1l-2 1.6c-.5.4-1.2.4-1.7 0
                   L3.5 15c-.5-.6-.4-1.7 0-2.5Z" transform="rotate(135 12 12)" />
        </svg>
        End Call
      </button>
    </div>

    <div class="brand">
      Powered by <strong id="brandName">Visual Graphx</strong>
    </div>
  </div>

  <script type="module">
    const $avatar     = document.getElementById('avatarImg');
    const $agentName  = document.getElementById('agentName');
    const $agentRole  = document.getElementById('agentRole');
    const $brandName  = document.getElementById('brandName');
    const $status     = document.getElementById('status');
    const $statusText = document.getElementById('statusText');
    const $endCallBtn = document.getElementById('endCallBtn');
    const $liveBadge  = document.getElementById('liveBadge');
    const $body       = document.getElementById('popupBody');

    // Read website_token from URL query param as early fallback
    const _urlParams = new URLSearchParams(window.location.search);
    const _urlWebsiteToken = _urlParams.get('wt') || '';
    const _isMonitorMode = _urlParams.get('mode') === 'monitor';

    let cfg = null;
    let conversation = null;
    let isCallActive = false;
    let endedNotified = false;
    let _heartbeatTimer = null;
    let _backendHeartbeatTimer = null;
    let _configReceived = false;
    let _callConnectedAt = null; // timestamp when call connected

    let _channel = null;
    try { _channel = new BroadcastChannel('cw-voice'); } catch (_) {}

    // ── Auto-close when opener tab is closed ──────────────────────
    let _openerCheckTimer = setInterval(() => {
      if (window.opener && !window.opener.closed) return;
      clearInterval(_openerCheckTimer);
      if (isCallActive) {
        endCall('Tab closed');
      } else {
        try { window.close(); } catch (_) {}
      }
    }, 1500);

    function setStatus(state, text) {
      $status.dataset.state = state;
      $statusText.textContent = text;
      $liveBadge.classList.toggle('show', state === 'connected');
    }

    function applyBranding(c) {
      document.documentElement.style.setProperty('--widget-color', c.color);
      document.documentElement.style.setProperty('--widget-color-soft', hexToRgba(c.color, 0.22));
      document.documentElement.style.setProperty('--widget-color-strong', hexToRgba(c.color, 0.40));
      $agentName.textContent = c.agentName;
      $agentRole.textContent = c.agentRole || 'Voice Assistant';
      if (c.brand) $brandName.textContent = c.brand;
      if (c.avatar) {
        $avatar.src = c.avatar;
        $avatar.onerror = () => { $avatar.src = makeFallbackAvatar(c.agentName, c.color); };
      } else {
        $avatar.src = makeFallbackAvatar(c.agentName, c.color);
      }
    }

    function postToOpener(event, payload = {}) {
      if (!window.opener || window.opener.closed) return;
      try {
        window.opener.postMessage({ source: 'cw-voice-popup', event, ...payload }, '*');
        if (window.opener.parent && window.opener.parent !== window.opener) {
          window.opener.parent.postMessage({ source: 'cw-voice-popup', event, ...payload }, '*');
        }
      } catch (_) {}
    }

    const HEARTBEAT_KEY = 'cw_voice_popup_heartbeat';
    function writeHeartbeat() {
      try { localStorage.setItem(HEARTBEAT_KEY, String(Date.now())); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'heartbeat', timestamp: Date.now(), active: isCallActive }); } catch (_) {}
      }
    }
    function clearHeartbeat() {
      try { localStorage.removeItem(HEARTBEAT_KEY); } catch (_) {}
      if (_channel) {
        try { _channel.postMessage({ type: 'ended', timestamp: Date.now() }); } catch (_) {}
      }
    }

    function apiPost(path, body) {
      const baseUrl = (cfg && cfg.baseUrl) || window.location.origin;
      const wt = (cfg && cfg.websiteToken) || _urlWebsiteToken;
      if (!wt && !cfg) return Promise.reject(new Error('No config yet'));
      const url = new URL(path, baseUrl);
      if (wt)                  url.searchParams.set('website_token', wt);
      if (cfg && cfg.cwConversation) url.searchParams.set('cw_conversation', cfg.cwConversation);
      return fetch(url.toString(), {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...(cfg && cfg.authToken ? { 'X-Auth-Token': cfg.authToken } : {}),
        },
        body: JSON.stringify(body || {}),
      });
    }

    function sendBackendHeartbeat() {
      if (!isCallActive || !cfg) return;
      apiPost('/api/v1/widget/conversations/voice_heartbeat', {})
        .then(r => r.json().catch(() => null))
        .then(d => {
          console.log('[VOICE-POPUP] heartbeat ->', d);
          // Another tab/page clicked "End Call" in the widget — stop this popup too
          if (d && d.end_requested) {
            // Ignore stale end_requested from previous call — give 8s grace after connect
            const callAge = _callConnectedAt ? Date.now() - _callConnectedAt : Infinity;
            if (callAge < 8000) {
              console.log('[VOICE-POPUP] ignoring stale end_requested (call age ' + Math.round(callAge/1000) + 's)');
            } else {
              console.log('[VOICE-POPUP] END_REQUESTED from backend — ending call now');
              handleCallEnded('Remote end requested');
            }
          }
        })
        .catch(e => console.warn('[VOICE-POPUP] heartbeat FAILED:', e?.message));
    }
    function startBackendHeartbeat() {
      if (_backendHeartbeatTimer) return;
      sendBackendHeartbeat();
      // Send every 3s (was 5s) — tighter window so widget status check always finds active record
      _backendHeartbeatTimer = setInterval(sendBackendHeartbeat, 3000);
    }
    function stopBackendHeartbeat() {
      if (_backendHeartbeatTimer) {
        clearInterval(_backendHeartbeatTimer);
        _backendHeartbeatTimer = null;
      }
    }

    window.addEventListener('message', (e) => {
      const d = e?.data;
      if (!d || typeof d !== 'object') return;
      if (d.source !== 'cw-widget') return;

      if (d.event === 'config' && d.config && !_configReceived) {
        _configReceived = true;
        cfg = d.config;
        applyBranding(cfg);
        if (_isMonitorMode) {
          startMonitorMode();
        } else {
          startCall();
        }
        return;
      }
      if (d.event === 'voice-state-update') {
        if (d.speaking !== undefined) {
          $body.classList.toggle('speaking', d.speaking);
        }
        return;
      }
      if (d.event === 'request-end-call') {
        endCall('Call ended');
        return;
      }
    });

    if (_channel) {
      _channel.addEventListener('message', (e) => {
        const m = e.data || {};
        if (m.type === 'ping') writeHeartbeat();
        else if (m.type === 'request-end-call') {
          if (!_isMonitorMode) endCall('Call ended');
        }
        else if (m.type === 'heartbeat' && _isMonitorMode) {
          if (!isCallActive) {
            isCallActive = true;
            setStatus('connected', 'Connected');
            $endCallBtn.disabled = false;
            $liveBadge.classList.add('show');
          }
        }
        else if (m.type === 'ended' && _isMonitorMode) {
          handleCallEnded('Call ended');
        }
        else if (m.type === 'speaking' && _isMonitorMode) {
          $body.classList.toggle('speaking', !!m.value);
        }
      });
    }

    // ── Monitor mode: sync with inline call, don't start own call ──
    function startMonitorMode() {
      isCallActive = true;
      setStatus('connected', 'Connected');
      $endCallBtn.disabled = false;
      $liveBadge.classList.add('show');
      writeHeartbeat();
      _heartbeatTimer = setInterval(writeHeartbeat, 1500);
    }

    async function startCall() {
      if (!cfg?.signedUrl) {
        setStatus('error', 'Missing signed URL');
        return;
      }

      writeHeartbeat();
      _heartbeatTimer = setInterval(writeHeartbeat, 1500);

      if (cfg.provider === 'dograh') {
        await startDograhCall();
      } else {
        await startElevenLabsCall();
      }
    }

    // ── ElevenLabs call ──────────────────────────────────────────────
    async function startElevenLabsCall() {
      try {
        setStatus('connecting', 'Requesting mic…');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());

        setStatus('connecting', 'Loading…');
        const mod = await import('https://esm.sh/@11labs/client');
        const Conversation = mod.Conversation;
        if (!Conversation) throw new Error('SDK did not expose Conversation');

        setStatus('connecting', 'Connecting…');
        conversation = await Conversation.startSession({
          signedUrl: cfg.signedUrl,

          dynamicVariables: {
            chatwoot_conversation_id:  cfg.cwConversationId  || '',
            chatwoot_conversation_url: cfg.cwConversationUrl || '',
            customer_name:             cfg.agentName         || 'Customer',
            website:                   cfg.brand             || '',
          },

          onConnect: () => {
            isCallActive = true;
            _callConnectedAt = Date.now();
            setStatus('connected', 'Connected');
            $endCallBtn.disabled = false;

            try {
              const elConvId = typeof conversation.getId === 'function'
                ? conversation.getId()
                : conversation.conversationId || null;
              if (elConvId) {
                apiPost('/api/v1/widget/conversations/voice_link_elevenlabs', {
                  elevenlabs_conversation_id: elConvId,
                }).catch(e => console.warn('[VOICE-POPUP] link conv id failed:', e?.message));
              }
            } catch (_) {}

            writeHeartbeat();
            startBackendHeartbeat();
            postToOpener('voice-popup-connected');
          },

          onDisconnect: () => handleCallEnded('Call ended'),

          onError: (err) => {
            const msg = (err && (err.message || err.toString())) || 'Unknown error';
            console.error('[VOICE-POPUP] error:', msg);
            setStatus('error', 'Error');
            $endCallBtn.disabled = true;
            postToOpener('voice-popup-error', { error: msg });
          },

          onMessage: ({ message, source }) => {
            const text = (message || '').toString().trim();
            if (!text) return;
            apiPost('/api/v1/widget/conversations/voice_transcript', {
              source, content: text,
            }).catch(e => console.warn('Transcript save failed:', e?.message));
            postToOpener('voice-popup-transcript', { source, message: text });
          },

          onModeChange: (mode) => {
            $body.classList.toggle('speaking', mode === 'speaking');
          },
        });
      } catch (error) {
        const msg = (error && error.message) || 'unknown';
        console.error('[VOICE-POPUP] startElevenLabsCall failed:', msg);
        setStatus('error',
          (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError'))
            ? 'Mic denied'
            : 'Failed');
        $endCallBtn.disabled = true;
        postToOpener('voice-popup-error', { error: msg });
      }
    }

    // ── Dograh call (WebRTC + WebSocket signaling) ───────────────────
    let _dograhWs = null;
    let _dograhPc = null;
    let _dograhStream = null;
    let _dograhRemoteAudio = null;

    async function startDograhCall() {
      try {
        setStatus('connecting', 'Requesting mic…');

        const signedUrl = cfg.dograhSignedUrl || cfg.signedUrl;
        const sessionToken = cfg.dograhSessionToken;
        const workflowRunId = cfg.dograhWorkflowRunId;
        const apiUrl = cfg.dograhApiUrl;

        if (!signedUrl || !sessionToken) {
          throw new Error('Missing Dograh signed_url or session_token');
        }

        // Fetch TURN credentials
        let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
        try {
          const turnResp = await fetch(`${apiUrl}/api/v1/public/embed/turn-credentials/${sessionToken}`);
          if (turnResp.ok) {
            const turnData = await turnResp.json();
            if (turnData?.ice_servers?.length) iceServers = turnData.ice_servers;
          }
        } catch (e) { console.warn('[VOICE-POPUP] TURN fetch failed:', e?.message); }

        setStatus('connecting', 'Connecting…');

        // Create RTCPeerConnection
        const pc = new RTCPeerConnection({ iceServers });
        _dograhPc = pc;
        const pcId = 'cw_' + Math.random().toString(36).slice(2, 10);

        // Get mic and add tracks
        const audioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true }
        });
        _dograhStream = audioStream;
        audioStream.getTracks().forEach(track => pc.addTrack(track, audioStream));

        // Remote audio playback
        const remoteAudio = new Audio();
        remoteAudio.autoplay = true;
        _dograhRemoteAudio = remoteAudio;

        pc.ontrack = (event) => {
          remoteAudio.srcObject = event.streams[0] || new MediaStream([event.track]);
        };

        // WebSocket signaling
        const ws = new WebSocket(signedUrl);
        _dograhWs = ws;

        const pendingCandidates = [];
        pc.onicecandidate = (event) => {
          if (!event.candidate) return;
          const msg = { type: 'ice-candidate', payload: event.candidate };
          if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
          else pendingCandidates.push(msg);
        };

        ws.onopen = async () => {
          pendingCandidates.forEach(msg => ws.send(JSON.stringify(msg)));
          pendingCandidates.length = 0;

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          ws.send(JSON.stringify({
            type: 'offer',
            payload: {
              sdp: pc.localDescription.sdp,
              type: 'offer',
              pc_id: pcId,
              workflow_id: null,
              workflow_run_id: workflowRunId,
              call_context_vars: {},
            },
          }));
        };

        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);

            if (msg.type === 'answer' && msg.payload) {
              pc.setRemoteDescription(new RTCSessionDescription({
                type: 'answer', sdp: msg.payload.sdp,
              }));
              isCallActive = true;
              _callConnectedAt = Date.now();
              setStatus('connected', 'Connected');
              $endCallBtn.disabled = false;
              writeHeartbeat();
              startBackendHeartbeat();
              postToOpener('voice-popup-connected');
            }

            if (msg.type === 'ice-candidate' && msg.payload) {
              pc.addIceCandidate(new RTCIceCandidate(msg.payload)).catch(() => {});
            }

            // Transcripts → Chatwoot (Dograh uses payload.text)
            if (msg.type === 'USER_TRANSCRIPTION' || msg.type === 'BOT_TEXT' ||
                msg.type === 'rtf-user-transcription' || msg.type === 'rtf-bot-text') {
              const source = (msg.type === 'USER_TRANSCRIPTION' || msg.type === 'rtf-user-transcription') ? 'user' : 'ai';
              const text = (msg.payload?.text || msg.text || msg.content || '').trim();
              if (text) {
                apiPost('/api/v1/widget/conversations/voice_transcript', {
                  source, content: text,
                }).catch(e => console.warn('Transcript save failed:', e?.message));
                postToOpener('voice-popup-transcript', { source, message: text });
              }
            }

            if (msg.type === 'BOT_TEXT' || msg.type === 'rtf-bot-text') {
              $body.classList.add('speaking');
            }
            if (msg.type === 'rtf-bot-stopped-speaking' || msg.type === 'BOT_STOPPED_SPEAKING') {
              $body.classList.remove('speaking');
            }

            if (msg.type === 'error') {
              console.error('[VOICE-POPUP] Dograh error:', msg);
              handleCallEnded('Error');
            }
          } catch (_) {}
        };

        ws.onclose = () => {
          if (isCallActive) handleCallEnded('Call ended');
        };

        ws.onerror = (err) => {
          console.error('[VOICE-POPUP] Dograh WS error:', err);
          setStatus('error', 'Connection failed');
          $endCallBtn.disabled = true;
          postToOpener('voice-popup-error', { error: 'WebSocket failed' });
        };

      } catch (error) {
        const msg = (error && error.message) || 'unknown';
        console.error('[VOICE-POPUP] startDograhCall failed:', msg);
        setStatus('error',
          (error && (error.name === 'NotAllowedError' || error.name === 'NotFoundError'))
            ? 'Mic denied' : 'Failed');
        $endCallBtn.disabled = true;
        postToOpener('voice-popup-error', { error: msg });
      }
    }

    function cleanupDograh() {
      try { _dograhStream?.getTracks().forEach(t => t.stop()); } catch (_) {}
      try { _dograhPc?.close(); } catch (_) {}
      try { _dograhWs?.close(); } catch (_) {}
      if (_dograhRemoteAudio) { try { _dograhRemoteAudio.srcObject = null; } catch (_) {} }
      _dograhStream = null;
      _dograhPc = null;
      _dograhWs = null;
      _dograhRemoteAudio = null;
    }

    async function endCall(reason) {
      // Dograh path
      if (_dograhWs || _dograhPc) {
        cleanupDograh();
        handleCallEnded(reason || 'Call ended');
        return;
      }
      // ElevenLabs path
      if (!conversation) { handleCallEnded(reason || 'Call ended'); return; }
      $endCallBtn.disabled = true;
      setStatus('connecting', 'Ending…');
      try { await conversation.endSession(); }
      catch (e) { console.warn('[VOICE-POPUP] endSession threw:', e?.message); }
      setTimeout(() => { if (isCallActive) handleCallEnded(reason || 'Call ended'); }, 1500);
    }

    function handleCallEnded(label) {
      isCallActive = false;
      setStatus('ended', label || 'Call ended');
      $endCallBtn.disabled = true;
      conversation = null;
      if (!endedNotified) {
        endedNotified = true;
        if (!_isMonitorMode) {
          apiPost('/api/v1/widget/conversations/voice_call_ended', {}).catch(() => {});
        }
        postToOpener('voice-popup-ended');
      }
      if (_heartbeatTimer) clearInterval(_heartbeatTimer);
      clearHeartbeat();
      if (!_isMonitorMode) stopBackendHeartbeat();
      setTimeout(() => { try { window.close(); } catch (_) {} }, 1200);
    }

    $endCallBtn.addEventListener('click', () => {
      if (_isMonitorMode) {
        // In monitor mode, tell the inline call to end via BroadcastChannel
        if (_channel) {
          try { _channel.postMessage({ type: 'request-end-call' }); } catch (_) {}
        }
        postToOpener('voice-popup-end-request');
        $endCallBtn.disabled = true;
        setStatus('connecting', 'Ending…');
        // If inline call doesn't respond within 3s, close anyway
        setTimeout(() => { if (isCallActive) handleCallEnded('Call ended'); }, 3000);
      } else {
        endCall('Call ended');
      }
    });

    window.addEventListener('beforeunload', () => {
      if (_heartbeatTimer) clearInterval(_heartbeatTimer);
      clearHeartbeat();
      stopBackendHeartbeat();
      if (_dograhWs || _dograhPc) { cleanupDograh(); }
      if (conversation && isCallActive) {
        try { conversation.endSession(); } catch (_) {}
      }
      if (!endedNotified && cfg) {
        endedNotified = true;
        try {
          const url = new URL('/api/v1/widget/conversations/voice_call_ended', cfg.baseUrl);
          if (cfg.websiteToken)   url.searchParams.set('website_token', cfg.websiteToken);
          if (cfg.cwConversation) url.searchParams.set('cw_conversation', cfg.cwConversation);
          navigator.sendBeacon(url.toString(), new Blob(['{}'], { type: 'application/json' }));
        } catch (_) {}
      }
      postToOpener('voice-popup-closed');
    });

    postToOpener('voice-popup-opened');
    postToOpener('voice-popup-request-config');
    let retries = 0;
    const _retryTimer = setInterval(() => {
      if (_configReceived || retries >= 10) { clearInterval(_retryTimer); return; }
      retries++;
      postToOpener('voice-popup-request-config');
    }, 500);
    setTimeout(() => {
      if (!_configReceived) {
        if (_isMonitorMode) {
          // Monitor mode can work without config from opener — use defaults
          _configReceived = true;
          startMonitorMode();
        } else {
          setStatus('error', 'No config');
        }
      }
    }, 6000);

    function hexToRgba(hex, alpha) {
      const m = (hex || '').replace('#', '').match(/^([0-9a-f]{6}|[0-9a-f]{3})$/i);
      if (!m) return `rgba(66, 153, 225, ${alpha})`;
      let h = m[1];
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function makeFallbackAvatar(name, color) {
      const initials = (name || 'AI')
        .split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
           <defs>
             <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
               <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
               <stop offset="100%" stop-color="${color}" stop-opacity="0.82"/>
             </linearGradient>
           </defs>
           <circle cx="50" cy="50" r="50" fill="url(#g)"/>
           <text x="50" y="62" text-anchor="middle"
                 font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
                 font-size="36" font-weight="600" fill="white">${initials}</text>
         </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }
  </script>
</body>
